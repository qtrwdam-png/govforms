<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GovForms — لوحة الإدارة</title>
  <script>const GOVFORMS_API_BASE = location.origin;</script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { theme: { extend: { fontFamily: { sans: ['Cairo', 'sans-serif'] } } } };</script>
  <link rel="stylesheet" href="css/style.css?v=3">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- ==================== شاشة تسجيل الدخول ==================== -->
  <div id="loginPage" class="login-page">
    <div class="login-card">
      <div class="logo">
        <div class="logo-icon">⚓</div>
        <h1>لوحة إدارة GovForms</h1>
        <div class="subtitle">تسجيل دخول المدير</div>
      </div>
      <div class="login-error" id="loginError"></div>
      <div class="field">
        <label style="display:block;font-weight:600;font-size:14px;margin-bottom:6px;">البريد الإلكتروني</label>
        <input type="email" id="loginEmail" dir="ltr" placeholder="admin@govforms.local" style="width:100%;padding:11px 14px;border:1px solid #cbd5e1;border-radius:8px;font-family:inherit;font-size:15px;">
      </div>
      <div class="field" style="margin-top:14px;">
        <label style="display:block;font-weight:600;font-size:14px;margin-bottom:6px;">كلمة المرور</label>
        <input type="password" id="loginPassword" dir="ltr" placeholder="••••••••" style="width:100%;padding:11px 14px;border:1px solid #cbd5e1;border-radius:8px;font-family:inherit;font-size:15px;">
      </div>
      <button class="btn-approve" style="width:100%;margin-top:20px;justify-content:center;padding:13px;" id="loginBtn">تسجيل الدخول</button>
    </div>
  </div>

  <!-- ==================== التطبيق الرئيسي ==================== -->
  <div id="appPage" class="app hidden">

    <!-- الرأس العلوي -->
    <div class="bg-white border-b border-gray-200 shadow-sm select-none fixed top-0 right-0 left-0 z-[100]" dir="rtl" id="adminTopbar">
      <div class="flex items-center gap-0 h-[46px] px-3 border-b border-gray-200">
        <div class="flex items-center gap-2 pl-4 border-l border-gray-200 mr-3">
          <div class="w-7 h-7 rounded-lg bg-gradient-to-br from-green-500 to-emerald-700 flex items-center justify-center shadow-lg">
            <span class="text-gray-900 font-black text-xs">⚓</span>
          </div>
          <span class="text-gray-800 font-bold text-sm tracking-wide">GovForms</span>
        </div>

        <div class="flex items-center gap-0 ml-auto overflow-x-auto scrollbar-hide">
          <!-- الزوار الحاليون (متصلون الآن) -->
          <div class="relative">
            <button class="flex items-center gap-1.5 px-3 h-[46px] hover:bg-gray-100 transition-colors text-xs border-l border-gray-200" title="الزوار الحاليون">
              <span class="w-2 h-2 rounded-full bg-green-400 animate-pulse inline-block"></span>
              <span class="text-green-600 font-bold text-sm" id="hdrVisitors">0</span>
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-users w-3.5 h-3.5 text-gray-400" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><path d="M16 3.128a4 4 0 0 1 0 7.744"></path><path d="M22 21v-2a4 4 0 0 0-3-3.87"></path><circle cx="9" cy="7" r="4"></circle></svg>
            </button>
          </div>

          <!-- سجلات اليوم -->
          <div class="flex items-center gap-1.5 px-3 h-[46px] border-l border-gray-200">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-trending-up w-3.5 h-3.5 text-gray-400 shrink-0" aria-hidden="true"><path d="M16 7h6v6"></path><path d="m22 7-8.5 8.5-5-5L2 17"></path></svg>
            <span class="text-gray-500 text-[11px]">اليوم</span>
            <span class="text-gray-800 font-bold text-sm" id="hdrToday">0</span>
          </div>

          <!-- الإجمالي -->
          <div class="flex items-center gap-1.5 px-3 h-[46px] border-l border-gray-200">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-globe w-3.5 h-3.5 text-gray-400 shrink-0" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"></path><path d="M2 12h20"></path></svg>
            <span class="text-gray-500 text-[11px]">إجمالي</span>
            <span class="text-gray-800 font-bold text-sm" id="hdrTotal">0</span>
          </div>

          <!-- مدفوعات معلّقة -->
          <div class="flex items-center gap-1.5 px-3 h-[46px] border-l border-gray-200">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-credit-card w-3.5 h-3.5 text-blue-600 shrink-0" aria-hidden="true"><rect width="20" height="14" x="2" y="5" rx="2"></rect><line x1="2" x2="22" y1="10" y2="10"></line></svg>
            <span class="text-blue-600 font-bold text-sm" id="hdrPayments">0</span>
          </div>

          <!-- OTP معلّقة -->
          <div class="flex items-center gap-1.5 px-3 h-[46px] border-l border-gray-200">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-phone w-3.5 h-3.5 text-emerald-600 shrink-0" aria-hidden="true"><path d="M13.832 16.568a1 1 0 0 0 1.213-.303l.355-.465A2 2 0 0 1 17 15h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2A18 18 0 0 1 2 4a2 2 0 0 1 2-2h3a2 2 0 0 1 2 2v3a2 2 0 0 1-.8 1.6l-.468.351a1 1 0 0 0-.292 1.233 14 14 0 0 0 6.392 6.384"></path></svg>
            <span class="text-emerald-600 font-bold text-sm" id="hdrOtp">0</span>
          </div>

          <div class="w-px h-5 bg-gray-100 mx-1 shrink-0"></div>

          <!-- الزوار: متصل/اليوم/الإجمالي (وهمي مؤقت) -->
          <div class="flex items-center gap-1.5 px-3 h-[46px] border-l border-gray-200">
            <span class="text-[11px] text-gray-500 shrink-0">زوار</span>
            <span class="text-green-600 font-bold text-sm" id="hdrVisLive">0</span>
            <span class="text-gray-400 text-xs">/</span>
            <span class="text-amber-600 font-bold text-sm" id="hdrVisToday">1</span>
            <span class="text-gray-400 text-xs">/</span>
            <span class="text-gray-400 font-bold text-sm" id="hdrVisTotal">810</span>
          </div>

          <!-- العملاء: بطاقات/OTP/الإجمالي (وهمي مؤقت) -->
          <div class="flex items-center gap-1.5 px-3 h-[46px] border-l border-gray-200">
            <span class="text-[11px] text-gray-500 shrink-0">عملاء</span>
            <span class="text-green-600 font-bold text-sm" id="hdrCliCards">484</span>
            <span class="text-gray-400 text-xs">/</span>
            <span class="text-amber-600 font-bold text-sm" id="hdrCliOtp">0</span>
            <span class="text-gray-400 text-xs">/</span>
            <span class="text-gray-400 font-bold text-sm" id="hdrCliTotal">810</span>
          </div>
        </div>

        <!-- أدوات يسارية -->
        <div class="flex items-center gap-0 border-r border-gray-200 mr-auto">
          <button class="flex items-center justify-center w-10 h-[46px] hover:bg-gray-100 transition-colors border-l border-gray-200 disabled:opacity-40 disabled:cursor-not-allowed" title="تصدير جميع البطاقات PDF">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-file-down w-4 h-4 text-gray-400 hover:text-gray-900 transition-colors" aria-hidden="true"><path d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z"></path><path d="M14 2v5a1 1 0 0 0 1 1h5"></path><path d="M12 18v-6"></path><path d="m9 15 3 3 3-3"></path></svg>
          </button>
          <button class="flex items-center justify-center w-10 h-[46px] hover:bg-gray-100 transition-colors border-l border-gray-200" title="إعدادات">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-settings w-4 h-4 text-gray-400 hover:text-gray-900 transition-colors" aria-hidden="true"><path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915"></path><circle cx="12" cy="12" r="3"></circle></svg>
          </button>
          <button class="flex items-center justify-center w-10 h-[46px] hover:bg-gray-100 transition-colors border-l border-gray-200" title="تنبيهات">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-bell w-4 h-4 text-gray-400 hover:text-gray-900 transition-colors" aria-hidden="true"><path d="M10.268 21a2 2 0 0 0 3.464 0"></path><path d="M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326"></path></svg>
          </button>
          <button class="flex items-center gap-2 px-3 h-[46px] hover:bg-gray-100 transition-colors" id="logoutBtn" title="تسجيل الخروج">
            <div class="w-7 h-7 rounded-full bg-gradient-to-br from-blue-500 to-purple-600 flex items-center justify-center">
              <span class="text-gray-900 text-xs font-bold" id="adminAvatar">T</span>
            </div>
            <span class="text-gray-700 text-xs font-medium hidden sm:inline" id="adminName">مدير</span>
            <svg class="w-3 h-3 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
          </button>
        </div>
      </div>
    </div>

    <!-- المحتوى -->
    <div class="content">

      <!-- صندوق الوارد -->
      <div class="inbox-layout" id="inboxLayout">
        <!-- القائمة -->
        <div class="inbox-list" dir="rtl">
          <!-- رأس القائمة -->
          <div id="inboxHeader">
            <div class="flex items-center gap-2 px-4 pt-4">
              <span class="text-sm font-semibold text-gray-700">صندوق الوارد</span>
              <span id="countBadge" class="inline-flex items-center justify-center min-w-[20px] h-5 px-1.5 rounded-full bg-gray-100 text-gray-600 text-xs font-semibold">0</span>
              <div class="flex-1"></div>
              <button class="filter-btn px-2.5 py-1 rounded-md text-xs font-medium text-gray-500 hover:bg-gray-100 transition" data-filter="all">الكل</button>
              <button class="filter-btn px-2.5 py-1 rounded-md text-xs font-medium text-gray-500 hover:bg-gray-100 transition" data-filter="card">بطاقة</button>
              <button class="filter-btn px-2.5 py-1 rounded-md text-xs font-medium text-gray-500 hover:bg-gray-100 transition" data-filter="archive">الأرشيف</button>
            </div>
            <div class="relative px-4 pt-3">
              <svg class="absolute right-7 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21 21-4.34-4.34"></path><circle cx="11" cy="11" r="8"></circle></svg>
              <input type="text" id="searchInput" placeholder="بحث (الاسم، الهوية، الهاتف، آخر 4 أرقام)" class="w-full pr-9 pl-3 py-2 rounded-lg bg-gray-50 border border-gray-200 text-sm text-gray-700 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-400 transition" value="">
            </div>
            <div class="flex items-center gap-2 px-4 py-2 border-b border-gray-100">
              <button id="selectAllBtn" class="flex items-center gap-1.5 text-xs font-medium text-gray-500 hover:text-gray-700 transition">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"></rect></svg>
                <span class="label">تحديد الكل</span>
              </button>
              <div class="flex-1"></div>
              <span id="checkedCount" class="text-[11px] text-gray-400 font-mono"></span>
            </div>
          </div>
          <!-- قائمة العملاء -->
          <div class="inbox-items flex-1 overflow-y-auto" id="inboxItems">
            <div class="px-4 py-10 text-center text-sm text-gray-400">جارٍ التحميل...</div>
          </div>
        </div>

        <!-- التفاصيل -->
        <div class="inbox-detail" id="inboxDetail" dir="rtl">
          <div class="flex items-center justify-center h-full text-gray-400">
            <div class="text-center">
              <div class="text-5xl mb-3">👈</div>
              <p class="text-sm">اختر سجلاً من القائمة لعرض التفاصيل</p>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- نافذة الحظر -->
  <div class="modal-overlay" id="blockModal">
    <div class="modal">
      <div class="modal-header">
        <h3>حظر العميل</h3>
        <button class="modal-close" onclick="closeModal('blockModal')">✕</button>
      </div>
      <div class="modal-body">
        <p style="margin-bottom:14px;color:var(--text-secondary);">سيتم منع العميل من تقديم طلبات جديدة.</p>
        <div class="field">
          <label style="display:block;font-weight:600;font-size:14px;margin-bottom:6px;">سبب الحظر</label>
          <input type="text" id="blockReason" placeholder="مثال: سلوك مشبوه" style="width:100%;padding:11px 14px;border:1px solid #cbd5e1;border-radius:8px;font-family:inherit;font-size:15px;">
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn-block" id="confirmBlockBtn" style="margin:0;">تأكيد الحظر</button>
        <button class="btn-reject" onclick="closeModal('blockModal')">إلغاء</button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <!-- Socket.io client -->
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script src="js/app.js?v=8"></script>
</body>
</html>
